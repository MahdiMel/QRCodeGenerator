<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern QR Code Generator</title>
    
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load qrcode.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        /* Ensure the generated canvas/image centers nicely */
        #qrcode img, #qrcode canvas { 
            display: block; 
            margin: 0 auto; 
            border-radius: 0.5rem;
        }
        /* Subtle pulse animation for the wrapper when it appears */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] p-8 sm:p-10 w-full max-w-md transition-all">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75v-.75zM16.5 6.75h.75v.75h-.75v-.75zM13.5 13.5h.75v.75h-.75v-.75zM13.5 19.5h.75v.75h-.75v-.75zM19.5 13.5h.75v.75h-.75v-.75zM19.5 19.5h.75v.75h-.75v-.75zM16.5 16.5h.75v.75h-.75v-.75z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight mb-2">QR Generator</h1>
            <p class="text-slate-500 text-sm">Enter a URL or text to create a shareable code.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label for="userInput" class="block text-sm font-medium text-slate-700 mb-1.5">Destination URL / Text</label>
                <input type="text" id="userInput" placeholder="https://example.com"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm">
                
                <!-- Hidden error message (replaces ugly alerts) -->
                <p id="errorMessage" class="text-rose-500 text-sm mt-2 hidden flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    Please enter some text or a URL.
                </p>
            </div>
            
            <button id="generateBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-4 rounded-xl transition-all duration-200 shadow-[0_4px_14px_0_rgba(79,70,229,0.39)] hover:shadow-[0_6px_20px_rgba(79,70,229,0.23)] hover:-translate-y-0.5 flex justify-center items-center">
                Generate QR Code
            </button>
        </div>

        <div class="mt-8 flex flex-col items-center justify-center min-h-[240px]">
            <!-- Wrapper for the QR code, hidden by default -->
            <div id="qrcode-wrapper" class="hidden flex flex-col items-center w-full">
                <div class="bg-white p-4 rounded-2xl shadow-[inset_0_2px_10px_rgba(0,0,0,0.05)] border border-slate-100 animate-pop-in">
                    <!-- The library will inject the canvas/image here -->
                    <div id="qrcode"></div>
                </div>
                
                <button id="downloadBtn" class="mt-6 w-full max-w-[220px] bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    Download
                </button>
            </div>
            
            <!-- Placeholder state shown before generation -->
            <div id="empty-state" class="text-slate-300 flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-24 h-24 mb-3 opacity-50">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z" />
                </svg>
                <span class="text-sm">Your code will appear here</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('generateBtn');
            const qrContainer = document.getElementById('qrcode');
            const qrWrapper = document.getElementById('qrcode-wrapper');
            const emptyState = document.getElementById('empty-state');
            const errorMsg = document.getElementById('errorMessage');
            const downloadBtn = document.getElementById('downloadBtn');

            // Main generation function
            function generateQR() {
                const text = input.value.trim();

                // Validation: Ensure input isn't empty
                if (!text) {
                    errorMsg.classList.remove('hidden');
                    input.classList.add('border-rose-300', 'focus:ring-rose-500');
                    input.classList.remove('focus:ring-indigo-500', 'border-slate-200');
                    
                    // Add a quick shake effect to the input
                    input.style.transform = 'translateX(-5px)';
                    setTimeout(() => input.style.transform = 'translateX(5px)', 100);
                    setTimeout(() => input.style.transform = 'translateX(-5px)', 200);
                    setTimeout(() => input.style.transform = 'translateX(0)', 300);
                    return;
                }

                // Clear any previous error states
                errorMsg.classList.add('hidden');
                input.classList.remove('border-rose-300', 'focus:ring-rose-500');
                input.classList.add('focus:ring-indigo-500', 'border-slate-200');

                // Clear previous QR code to prevent appending multiple images
                qrContainer.innerHTML = '';

                // Switch UI states: hide empty placeholder, show wrapper
                emptyState.classList.add('hidden');
                
                // Remove and re-add the wrapper to trigger the pop-in animation again
                qrWrapper.classList.add('hidden');
                void qrWrapper.offsetWidth; // Trigger reflow to restart animation
                qrWrapper.classList.remove('hidden');

                // Generate the new QR code using the library
                new QRCode(qrContainer, {
                    text: text,
                    width: 220,
                    height: 220,
                    colorDark : "#0f172a", /* Using slate-900 instead of pure black for a softer look */
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H /* High error correction */
                });
            }

            // Event listener for the button click
            btn.addEventListener('click', generateQR);
            
            // Allow the user to just press 'Enter' on their keyboard to generate
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateQR();
                }
            });
            
            // Clear errors when the user starts typing again
            input.addEventListener('input', function() {
                if (input.value.trim()) {
                    errorMsg.classList.add('hidden');
                    input.classList.remove('border-rose-300', 'focus:ring-rose-500');
                    input.classList.add('focus:ring-indigo-500', 'border-slate-200');
                }
            });

            // Event listener for the download button
            downloadBtn.addEventListener('click', () => {
                // qrcode.js creates a canvas and an image. We extract the data URL from either.
                const qrCanvas = qrContainer.querySelector('canvas');
                const qrImage = qrContainer.querySelector('img');
                
                let imageUrl = '';
                
                // Prefer the image src if it has been fully generated, otherwise fallback to canvas
                if (qrImage && qrImage.getAttribute('src')) {
                    imageUrl = qrImage.getAttribute('src');
                } else if (qrCanvas) {
                    imageUrl = qrCanvas.toDataURL("image/png");
                }
                
                if (imageUrl) {
                    // Create an invisible anchor tag to trigger the download
                    const downloadLink = document.createElement('a');
                    downloadLink.href = imageUrl;
                    downloadLink.download = 'qrcode.png';
                    
                    // Append, click, and remove
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                }
            });
        });
    </script>
</body>
</html>
